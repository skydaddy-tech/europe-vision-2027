<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F4F3EB"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}.toc button:disabled{opacity:.6;cursor:default}
.ctrl.locked{padding:12px 18px}

<title>2027 유럽비전트립 · 부모님 함께 보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700&display=swap">
<style id="css">
/* Layout: one slide per screen, sticky section header on top, floating control bar at the bottom (withmission-style follow-along) */
:root{
  --paper:#F4F3EB; --card:#FCFBF7; --ink:#182824; --muted:#4B6159; --green:#183F35; --green2:#1F4C40;
  --coral:#E2643E; --coral-dk:#C24E2C; --lime:#D6F873; --line:#E4E1D4; --soft:#F1EFE5;
  --cool1:#EEF2F3; --cool2:#D9E3E8; --cool-ink:#3D5A72; --warm1:#FBEDE3; --warm2:#F4D3BF; --warm-ink:#B8442A;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --serif:'Noto Serif KR','Apple SD Gothic Neo',serif;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--paper) 70%,rgba(244,243,235,0))}
.brand{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:900;font-size:13px;color:var(--green);letter-spacing:-.2px}
.secs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.sec{flex:none;height:28px;min-width:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line);transition:all .5s var(--ease);padding:0 9px;white-space:nowrap}
.sec.on{background:linear-gradient(135deg,#E8743F,#C9532F);color:#FCFBF7;border-color:transparent;box-shadow:0 6px 18px rgba(226,100,62,.35);min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.sec.on b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#FCFBF7;color:var(--coral-dk);align-items:center;justify-content:center;font-size:11px;margin-right:6px;flex:none}
.menu{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--green)}
.progress{height:3px;background:var(--line);margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--coral);border-radius:3px;transition:width .6s var(--ease)}

/* stage */
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:transform .55s var(--ease),opacity .45s var(--ease)}
.slide.enter-next{transform:translateX(18%);opacity:0}
.slide.enter-prev{transform:translateX(-18%);opacity:0}
.slide.leave-next{transform:translateX(-14%);opacity:0}
.slide.leave-prev{transform:translateX(14%);opacity:0}
.inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.slide.dark{background:linear-gradient(150deg,var(--green2),#133229);color:#F4F3EB}
.slide.coral{background:linear-gradient(150deg,#C9532F,#A93F20);color:#FCFBF7}
.slide.center .inner{justify-content:center}
.inner>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.inner>*{animation:none}.slide{transition:opacity .2s}.slide.enter-next,.slide.enter-prev,.slide.leave-next,.slide.leave-prev{transform:none}}

/* type */
.eyebrow{font-size:13px;font-weight:700;color:var(--coral-dk)}
.dark .eyebrow{color:var(--lime)}
.pill{align-self:flex-start;display:inline-block;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.pill.lime{background:var(--lime);color:var(--green)}
.pill.light{background:var(--card);color:var(--green);border:1px solid var(--line)}
.pill.white{background:#FCFBF7;color:#A93F20}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:40px;line-height:1.1;font-weight:900;letter-spacing:-1.5px;color:var(--green)}
h2{font-size:29px;line-height:1.25;font-weight:900;letter-spacing:-.8px;color:var(--green)}
.dark h2,.coral h2,.dark h1{color:#F4F3EB}
h2 em,h1 em{font-style:normal;color:var(--coral)}
.dark h2 em{color:#F2A184}
.dark h2 em.lime{color:var(--lime)}
h3{font-size:18px;font-weight:900;letter-spacing:-.3px;color:var(--green)}
p{margin:0;font-size:15.5px;line-height:1.7;color:var(--muted)}
.dark p{color:#C9D6CF}
.coral p{color:#FFE3D2}
.sub{font-size:22px;font-weight:900;color:var(--coral);letter-spacing:-.5px}
.hl{align-self:flex-start;font-weight:700;color:var(--ink);background:linear-gradient(180deg,rgba(214,248,115,0) 58%,var(--lime) 58%);padding:0 3px;font-size:16px;line-height:1.6}
.verse{font-family:var(--serif);font-size:21px;line-height:1.7;color:#FCFBF7;font-weight:700}
.ref{font-size:14px;font-weight:700;color:#FFE3D2}
.big{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:#F2A184}
.bar{width:56px;height:4px;border-radius:2px;background:var(--coral)}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px;box-shadow:0 10px 30px rgba(24,40,36,.07);display:flex;flex-direction:column;gap:8px}
.card.green{background:var(--green);border-color:var(--green);box-shadow:0 10px 30px rgba(24,40,36,.16)}
.card.green h3{color:#F4F3EB}.card.green p{color:#C9D6CF}
.card.cool{background:linear-gradient(160deg,var(--cool1),var(--cool2));border-color:#D3DDE2}
.card.cool h3,.card.cool .lbl{color:var(--cool-ink)}
.card.warm{background:linear-gradient(160deg,var(--warm1),var(--warm2));border-color:#EFCDB8}
.card.warm h3,.card.warm .lbl{color:var(--warm-ink)}
.lbl{font-size:13px;font-weight:700}
.money{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15}
.card.cool .money{color:#5B7488}.card.warm .money{color:var(--warm-ink)}
.row{display:flex;gap:10px;align-items:center}
.num{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.card.green .num{background:var(--lime);border-color:var(--lime)}
.icon{flex:none;width:44px;height:44px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.card.green .icon{background:var(--lime)}
.icon svg{width:22px;height:22px;stroke:var(--lime);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card.green .icon svg{stroke:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;border:1.5px solid var(--coral-dk);color:var(--coral-dk);background:var(--card)}
.chip.g{border-color:var(--line);color:var(--green);background:var(--card)}
.dark .chip{border-color:#7C9A8C;color:#F4F3EB;background:transparent}
.chip.solid{background:var(--coral);color:#FCFBF7;border-color:var(--coral)}
.chip.lime{background:var(--lime);border-color:var(--lime);color:var(--green)}
.photo{width:100%;max-width:100%;border-radius:22px;object-fit:cover;box-shadow:0 14px 36px rgba(24,40,36,.18);display:block}
.route{display:flex;flex-direction:column;gap:0}
.stop{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.stop.k{background:var(--green);border-color:var(--green)}
.stop.k strong{color:#F4F3EB}
.stop strong{flex:1;font-size:17px;font-weight:900;color:var(--green)}
.stop span{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;border:1.5px solid #B9C4BE;color:var(--muted)}
.stop.k span{background:var(--lime);border-color:var(--lime);color:var(--green)}
.link{width:2px;height:12px;background:var(--coral);margin-left:26px}
.tbl{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.tr{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.tr:first-child{border-top:none}
.tr:nth-child(even){background:var(--soft)}
.tr b{color:var(--green);font-size:14.5px}
.tr div{min-width:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.tr div small{display:block;color:var(--warm-ink);font-weight:700;font-size:13.5px}
.tr.last{background:var(--warm1)!important}.tr.last b,.tr.last div{color:var(--warm-ink);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{padding:14px}
.grid2 h3{font-size:16px}
.grid2 p{font-size:13px;line-height:1.5}
.tagrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.n{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid #B9C4BE;color:var(--muted);flex:none}
.n.k{background:var(--lime);border-color:var(--lime);color:var(--green)}
.contact{display:flex;flex-direction:column;gap:8px}
.tel{font-size:22px;font-weight:900;color:#F4F3EB;letter-spacing:.5px;user-select:all}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.back{pointer-events:auto;background:var(--lime);color:var(--green);border:none;border-radius:999px;padding:10px 18px;font-weight:900;font-size:14px;box-shadow:0 8px 24px rgba(24,40,36,.2)}
.ctrl{pointer-events:auto;width:100%;max-width:560px;display:flex;align-items:center;gap:10px;background:rgba(252,251,247,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #FFFFFF;border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 14px 40px rgba(24,40,36,.18)}
.status{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.status .st{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:#2F9E6B;box-shadow:0 0 0 0 rgba(47,158,107,.5);animation:pulse 1.8s infinite}
.dot.free{background:#B9C4BE;animation:none}
.dot.pres{background:var(--coral);box-shadow:0 0 0 0 rgba(226,100,62,.5)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(47,158,107,0)}100%{box-shadow:0 0 0 0 rgba(47,158,107,0)}}
.status .pg{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nav{flex:none;width:46px;height:46px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--green)}
.nav.next{background:var(--green);color:#F4F3EB}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav:disabled{opacity:.35;cursor:default}
.ctrl.pres{background:rgba(24,63,53,.95);border-color:var(--green2)}
.ctrl.pres .status .st{color:#F4F3EB}.ctrl.pres .status .pg{color:#C9D6CF}
.ctrl.pres .nav{background:rgba(244,243,235,.12);color:#F4F3EB}.ctrl.pres .nav.next{background:var(--coral)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(24,40,36,.35);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:600px;max-height:82%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .45s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-h small{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.x{border:none;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--green)}
.toc-sec{font-size:12px;font-weight:700;color:var(--coral-dk);margin:14px 2px 6px}
.toc{display:flex;flex-direction:column;gap:6px}
.toc button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14.5px;color:var(--ink)}
.toc button i{font-style:normal;flex:none;width:26px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.toc button.cur{border-color:var(--coral);box-shadow:0 0 0 2px rgba(226,100,62,.25)}
.toc button.live::after{content:"발표 중";margin-left:auto;font-size:11px;font-weight:700;background:var(--lime);color:var(--green);border-radius:999px;padding:2px 8px;flex:none}
.pres-box{margin-top:18px;padding:14px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.pres-box p{font-size:13px}
.pres-btn{align-self:flex-start;border:none;background:var(--green);color:#F4F3EB;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--green);color:#F4F3EB;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(24,40,36,.25);max-width:calc(100% - 32px);text-align:center;animation:up .35s var(--ease)}
</style>
</head><body>

var TOPIC = "dongnae-evt2027-8ca9ea3c1cfd6af1";
var RELAY = "https://ntfy.sh/" + TOPIC;
var PKEY = "#pastor-57add136";
var KEY = "evt-sync-v2";
var saved = {};
try { saved = JSON.parse(sessionStorage.getItem(KEY) || "{}") || {}; } catch(e) { saved = {}; }
var presenter = location.hash === PKEY;
var unlocked = false;          /* true after the pastor allows free browsing */
var idx = typeof saved.idx === "number" ? Math.max(0, Math.min(S.length-1, saved.idx)) : 0;
var connected = false;
function mode(){ return presenter ? "present" : (unlocked ? "free" : "follow"); }
function save(){ try { sessionStorage.setItem(KEY, JSON.stringify({idx: idx})); } catch(e) {} }

/* ---------- shell ---------- */
var app = document.getElementById("app");
app.innerHTML =
 '<header class="top"><span class="brand">I AM CHURCH</span><div class="secs" id="secs"></div><button class="menu" id="menuBtn" aria-label="목차 열기">목차</button></header>'+
 '<div class="progress"><i id="prog"></i></div>'+
 '<main class="stage" id="stage" aria-live="polite"></main>'+
 '<div class="dock">'+
 '<div class="ctrl" id="ctrl"><div class="status"><span class="st"><i class="dot" id="dot"></i><span id="stText"></span></span><span class="pg" id="pg"></span></div>'+
 '<button class="nav" id="prevBtn" aria-label="이전 화면"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>'+
 '<button class="nav next" id="nextBtn" aria-label="다음 화면"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>';

var stage = document.getElementById("stage"), cur = null;

function slideEl(i){
  var s = S[i], el = document.createElement("section");
  el.className = "slide " + (s.cls || "");
  el.setAttribute("aria-label", (i+1) + "번째 화면: " + s.title);
  el.innerHTML = '<div class="inner">' + s.html + '</div>';
  var kids = el.firstChild.children;
  for (var k = 0; k < kids.length; k++) kids[k].style.setProperty("--i", k);
  return el;
}

function render(dir){
  var el = slideEl(idx);
  if (cur && dir) {
    el.classList.add(dir > 0 ? "enter-next" : "enter-prev");
    stage.appendChild(el);
    var old = cur;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      el.classList.remove("enter-next","enter-prev");
      old.classList.add(dir > 0 ? "leave-next" : "leave-prev");
      setTimeout(function(){ if (old.parentNode) old.parentNode.removeChild(old); }, 560);
    });});
  } else {
    stage.innerHTML = ""; stage.appendChild(el);
  }
  cur = el;
  chrome();
  save();
}

function chrome(){
  var s = S[idx], m = mode();
  var secs = document.getElementById("secs"), h = "";
  SECTIONS.forEach(function(x){
    h += x.n === s.sec ? '<span class="sec on"><b>'+x.n+'</b>'+x.name+'</span>' : '<span class="sec">'+x.n+'</span>';
  });
  secs.innerHTML = h;
  document.getElementById("prog").style.width = ((idx+1)/S.length*100) + "%";
  document.getElementById("pg").textContent = (idx+1) + " / " + S.length + " · " + s.title;
  var dot = document.getElementById("dot"), st = document.getElementById("stText"), ctrl = document.getElementById("ctrl");
  ctrl.classList.toggle("pres", m === "present");
  ctrl.classList.toggle("locked", m === "follow");
  dot.className = "dot" + (m === "present" ? " pres" : (!connected || m === "free") ? " free" : "");
  if (m === "present") st.textContent = connected ? "발표자 · 넘기면 모두 함께 넘어갑니다" : "발표자 · 연결 중…";
  else if (m === "free") st.textContent = "발표가 끝났습니다 · 자유롭게 넘겨 보세요";
  else st.textContent = connected ? "목사님 화면을 따라가는 중" : "발표 화면에 연결하는 중…";
  var showNav = m !== "follow";
  document.getElementById("prevBtn").hidden = !showNav;
  document.getElementById("nextBtn").hidden = !showNav;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === S.length-1;
}

function show(n){
  n = Math.max(0, Math.min(S.length-1, n|0));
  if (n === idx) { chrome(); return; }
  var dir = n > idx ? 1 : -1;
  idx = n; render(dir);
}

function toast(msg){
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
}

/* ---------- relay (ntfy.sh) ---------- */
function apply(msg){
  var d; try { d = JSON.parse(msg); } catch(e) { return; }
  if (!d || typeof d.s !== "number") return;
  if (presenter) return;
  var wasFree = unlocked;
  unlocked = d.free === true;
  if (unlocked && !wasFree) toast("발표가 끝났습니다. 이제 자유롭게 넘겨 보세요.");
  if (!unlocked) show(d.s); else chrome();
}
function fetchLatest(){
  return fetch(RELAY + "/json?poll=1&since=latest").then(function(r){ return r.text(); }).then(function(t){
    var lines = t.trim().split("\n"), last = null;
    lines.forEach(function(l){ try { var o = JSON.parse(l); if (o.event === "message") last = o; } catch(e) {} });
    return last ? last.message : null;
  });
}
function subscribe(){
  if (!window.EventSource) return;
  var es = new EventSource(RELAY + "/sse");
  es.onopen = function(){ connected = true; chrome(); };
  es.onerror = function(){ connected = false; chrome(); };
  es.onmessage = function(e){
    connected = true;
    try { var o = JSON.parse(e.data); if (o.event === "message") apply(o.message); } catch(err) {}
  };
}
var sendTimer = null, freeSent = false;
function send(){
  clearTimeout(sendTimer);
  sendTimer = setTimeout(function(){
    fetch(RELAY, {method: "POST", body: JSON.stringify({s: idx, free: freeSent})})
      .then(function(r){ if (!r.ok) throw r; connected = true; chrome(); })
      .catch(function(){ connected = false; chrome(); toast("신호를 보내지 못했습니다. 인터넷 연결을 확인하고 다시 넘겨 주세요."); });
  }, 250);
}
function go(n){
  var m = mode();
  if (m === "follow") return;
  n = Math.max(0, Math.min(S.length-1, n));
  if (n === idx) return;
  show(n);
  if (m === "present") send();
}

/* ---------- index sheet ---------- */
function openSheet(){
  var m = mode();
  var sh = document.createElement("div"); sh.className = "sheet";
  var h = '<div class="panel" role="dialog" aria-label="목차"><div class="panel-h"><small>INDEX</small><button class="x" aria-label="닫기">×</button></div><h3 style="font-size:20px">2027 유럽비전트립 · 함께 보기</h3>';
  if (m === "follow") h += '<p style="font-size:13px;margin-top:6px">발표 중에는 목사님이 넘기는 화면을 함께 봅니다. 발표가 끝나면 원하는 화면을 골라 보실 수 있습니다.</p>';
  SECTIONS.forEach(function(x){
    h += '<div class="toc-sec">' + x.n + ' · ' + x.name + '</div><div class="toc">';
    S.forEach(function(s, i){ if (s.sec === x.n) h += '<button data-i="'+i+'" class="'+(i===idx?'cur':'')+'"'+(m==="follow"?' disabled':'')+'><i>'+String(i+1).padStart(2,"0")+'</i>'+s.title+'</button>'; });
    h += '</div>';
  });
  if (m === "present") {
    h += '<div class="pres-box"><p>' + (freeSent ? "지금 부모님이 자유롭게 넘겨 보실 수 있습니다." : "지금 부모님 화면은 잠겨 있고, 목사님이 넘길 때만 넘어갑니다.") + '</p><button class="pres-btn" id="freeToggle">' + (freeSent ? "다시 잠그고 내 화면 따라오게 하기" : "발표 마치기 · 자유롭게 보기 허용") + '</button></div>';
  }
  h += '</div>';
  sh.innerHTML = h;
  document.body.appendChild(sh);
  function close(){ if (sh.parentNode) sh.parentNode.removeChild(sh); document.getElementById("menuBtn").focus(); }
  sh.addEventListener("click", function(e){
    if (e.target === sh || e.target.classList.contains("x")) return close();
    var b = e.target.closest("button[data-i]");
    if (b && !b.disabled) { close(); go(+b.getAttribute("data-i")); return; }
    if (e.target.id === "freeToggle") {
      freeSent = !freeSent; close(); send();
      toast(freeSent ? "부모님 화면 잠금을 풀었습니다." : "부모님 화면을 다시 잠갔습니다.");
    }
  });
  sh.querySelector(".x").focus();
}

/* ---------- input ---------- */
document.getElementById("menuBtn").addEventListener("click", openSheet);
document.getElementById("prevBtn").addEventListener("click", function(){ go(idx-1); });
document.getElementById("nextBtn").addEventListener("click", function(){ go(idx+1); });
document.addEventListener("keydown", function(e){
  if (document.querySelector(".sheet")) { if (e.key === "Escape") { var s = document.querySelector(".sheet"); s.parentNode.removeChild(s); } return; }
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(idx+1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx-1); }
});
var tx = null, ty = null;
stage.addEventListener("touchstart", function(e){ var t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
stage.addEventListener("touchend", function(e){
  if (tx === null) return;
  var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty; tx = null;
  if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4) go(idx + (dx < 0 ? 1 : -1));
}, {passive:true});

document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible" && !presenter) fetchLatest().then(function(m){ if (m) apply(m); }).catch(function(){});
});
/* ---------- start ---------- */
render(0);
fetchLatest().then(function(m){
  if (m) {
    if (presenter) {
      try { var d = JSON.parse(m); if (typeof d.s === "number") { freeSent = d.free === true; show(d.s); } } catch(e) {}
    } else apply(m);
  }
  connected = true; chrome();
}).catch(function(){ chrome(); }).then(function(){ if (!presenter) subscribe(); });
if (presenter) toast("발표자 모드입니다. 넘기는 화면이 부모님 휴대폰에도 나타납니다.");
})();
</script>
</body></html>
